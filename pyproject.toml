[project]
name = "nvjup-spec-tests"
version = "0.0.0"
description = "Neovim-native Jupyter notebook editor test and sidecar environment"
requires-python = ">=3.11"
dependencies = [
  "jupyter-client>=8.6,<9",
]

[dependency-groups]
test = [
  "ipykernel>=6.29,<8",
  "jsonschema>=4.23,<5",
  "nbformat>=5.10,<6",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]
