[project]
name = "nvjup-spec-tests"
version = "0.0.0"
description = "Executable Stage 0 contracts and fixtures for nvjup"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = [
  "jsonschema>=4.23,<5",
  "nbformat>=5.10,<6",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]
